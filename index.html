<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fonda Suiza: Carrer Ample Survivors</title>
  
  <!-- Llibreria Leaflet pel mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --gold: #f39c12;
      --vermut: #8b0000;
      --fonda-dark: #140d0b;
      --trencadis-blue: #1b4965;
      --trencadis-green: #2a9d8f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Impact', 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--fonda-dark); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* ESTIL TRENCADÍS MODERNISTA AMB ANIMACIONS */
    .trencadis-pattern {
      background: linear-gradient(135deg, #2b110b 25%, #180d09 25%, #180d09 50%, #2b110b 50%, #2b110b 75%, #180d09 75%, #180d09 100%);
      background-size: 28px 28px;
    }

    /* HUD SUPERIOR */
    header {
      background: #20120e;
      border-bottom: 3px solid var(--gold);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .player-profile { display: flex; align-items: center; gap: 8px; }
    .avatar-mini { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); background: #351c14; overflow: hidden; }
    .hud-meta { display: flex; flex-direction: column; gap: 2px; }
    .hud-name { font-size: 0.95rem; color: var(--gold); letter-spacing: 0.5px; }
    .stats-row { display: flex; gap: 8px; font-size: 0.75rem; }
    .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; background: rgba(0,0,0,0.6); }
    .badge-hp { color: #ff4757; border: 1px solid #ff4757; }
    .badge-vermut { color: #ffa502; border: 1px solid #ffa502; }
    .badge-nut { color: #2ed573; border: 1px solid #2ed573; }

    /* CONTENIDOR DEL MAPA */
    #map-wrapper { flex: 1; position: relative; width: 100%; }
    #map { width: 100%; height: 100%; }

    /* BOTONERA D'ACCIÓ RÀPIDA AL MAPA */
    .map-controls {
      position: absolute;
      bottom: 20px;
      right: 15px;
      z-index: 800;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .action-btn {
      background: linear-gradient(180deg, #b33939, var(--vermut));
      border: 2px solid var(--gold);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      font-weight: bold;
      transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.92); }
    .action-btn.radar { background: linear-gradient(180deg, #2e86de, #1b4965); }

    /* OVERLAYS I MODALS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 4, 0.92);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .game-window {
      background: #241410;
      border: 3px double var(--gold);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 0 30px rgba(243, 156, 18, 0.35);
      position: relative;
    }
    .game-window h2 { color: var(--gold); font-size: 1.4rem; margin-bottom: 6px; text-transform: uppercase; }

    /* CREADOR D'AVATAR */
    .avatar-display { width: 120px; height: 120px; margin: 10px auto; border-radius: 50%; border: 3px solid var(--gold); background: #3b2016; }
    .form-group { text-align: left; margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.72rem; color: var(--gold); margin-bottom: 2px; }
    select, input[type="text"] {
      width: 100%; padding: 8px; background: #130a08; border: 1px solid var(--gold); color: #fff; border-radius: 6px; outline: none; font-size: 0.85rem;
    }
    .start-btn {
      width: 100%; padding: 12px; margin-top: 10px; background: linear-gradient(180deg, var(--gold), #b7791f);
      border: none; border-radius: 25px; color: #1a0b06; font-size: 1.1rem; font-weight: bold; cursor: pointer;
    }

    /* SISTEMA DE COMBAT TIPUS ARCADE */
    .combat-shout-banner {
      background: #781212;
      border: 2px dashed #ffde59;
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
      font-size: 1.15rem;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      animation: shake 0.5s infinite alternate;
    }
    @keyframes shake {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg) scale(1.03); }
    }
    .timing-bar-container {
      width: 100%;
      height: 28px;
      background: #111;
      border: 2px solid var(--gold);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      margin: 15px 0 10px;
    }
    .timing-target-zone {
      position: absolute;
      left: 45%;
      width: 15%;
      height: 100%;
      background: #2ed573;
      box-shadow: 0 0 10px #2ed573;
    }
    .timing-cursor {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: #fff;
      box-shadow: 0 0 8px #fff;
    }
    .combat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .combat-btn {
      padding: 12px 6px;
      background: #3b1b14;
      border: 1px solid var(--gold);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .combat-btn:active { transform: scale(0.95); background: #55271d; }
    .btn-power { background: linear-gradient(180deg, #d35400, #962d00); border-color: #ff9f43; grid-column: span 2; }

    /* PREGUNTES DE REUS */
    .quiz-answers { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .quiz-btn {
      padding: 10px;
      background: #1c2e3d;
      border: 1px solid #48dbfb;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 0.85rem;
    }
    .quiz-btn:hover { background: #29465e; }

    /* ANIMACIÓ DE DANYS FLOTANTS */
    .floating-text {
      position: absolute;
      font-size: 1.3rem;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 0.8s forwards;
      z-index: 2000;
      text-shadow: 2px 2px 2px black;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
  </style>
</head>
<body class="trencadis-pattern">

  <!-- HUD PRINCIPAL -->
  <header>
    <div class="player-profile">
      <div class="avatar-mini" id="hud-avatar"></div>
      <div class="hud-meta">
        <span class="hud-name" id="hud-name">Ganxet Anònim</span>
        <div class="stats-row">
          <span class="badge badge-hp">❤️ <span id="val-hp">100</span></span>
          <span class="badge badge-vermut">🍸 <span id="val-vermut">2</span></span>
          <span class="badge badge-nut">🌰 <span id="val-nuts">15</span></span>
        </div>
      </div>
    </div>
    <div>
      <span class="badge" style="background:#57606f; font-size: 0.65rem;" id="hud-religion">Fe</span>
    </div>
  </header>

  <!-- MAPA INTERACTIU -->
  <div id="map-wrapper">
    <div id="map"></div>
    <div class="map-controls">
      <button class="action-btn radar" onclick="Engine.scanArea()">📡 Cridar Fauna Urbana</button>
      <button class="action-btn" onclick="Engine.walkPlayer()">🚶 Avançar pel Carrer Ample</button>
      <button class="action-btn" style="background:#27ae60;" onclick="Engine.gpsReal()">📍 GPS Real</button>
    </div>
  </div>

  <!-- PANTALLA 1: DISSENYADOR D'AVATAR I RELIGIÓ -->
  <div id="modal-char" class="modal-overlay">
    <div class="game-window">
      <h2>Crea el teu Heroi Ganxet</h2>
      <p style="font-size:0.78rem; color:#bbb;">Superviu al fauna del Carrer Ample davant de la Fonda Suiza.</p>
      
      <div class="avatar-display" id="avatar-render"></div>

      <div class="form-group">
        <label>Nom o Renom del Carrer:</label>
        <input type="text" id="cfg-name" value="Tonet del Vermut" maxlength="18">
      </div>

      <div class="form-group">
        <label>To de Pell:</label>
        <select id="cfg-skin" onchange="Avatar.update()">
          <option value="#f8c291">Pell de terrassa assolellada</option>
          <option value="#e5b88f">Moreno d'avellaner</option>
          <option value="#8d5524">Cafè de taverna fosca</option>
          <option value="#fbc531">Groc d'haver menjat massa a deshores</option>
        </select>
      </div>

      <div class="form-group">
        <label>Barret / Complements de Cap:</label>
        <select id="cfg-hat" onchange="Avatar.update()">
          <option value="barretina">Barretina Ganxeta de Combat</option>
          <option value="gorra">Gorra de vell vigilant d'obres</option>
          <option value="casc">Casc de patinet trucat</option>
          <option value="modernista">Copalta modernista burgès</option>
          <option value="cap">Cap rapat de baralla</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ulleres i Mirada:</label>
        <select id="cfg-glasses" onchange="Avatar.update()">
          <option value="sol">Ulleres fosques de ressaca de vermut</option>
          <option value="gaudi">Ulleres rodones estil Gaudí</option>
          <option value="pegat">Pegat a l'ull per batussa recent</option>
          <option value="cap">Ulls vermells pel vent de Mestral</option>
        </select>
      </div>

      <div class="form-group">
        <label>Religió / Doctrina (Defineix el teu Superpoder):</label>
        <select id="cfg-religion">
          <option value="Misericòrdia">Devot de Misericòrdia (Immunitat Celestial)</option>
          <option value="Vermutisme">Vermutisme Radical (Fúria alcohòlica x2)</option>
          <option value="Anti-Tarragona">Anti-Tarragona Furibund (Tret d'Avellanes metralladora)</option>
          <option value="Nihilisme">Nihilisme de la Fonda (Menjar callo a les 19h regenera HP)</option>
        </select>
      </div>

      <button class="start-btn" onclick="Engine.initGame()">¡Baixar al Carrer Ample!</button>
    </div>
  </div>

  <!-- MODAL DE COMBAT ARCADE -->
  <div id="modal-combat" class="modal-overlay" style="display:none;">
    <div class="game-window">
      <h2 id="battle-enemy-name">ENEMIC</h2>
      <div class="combat-shout-banner" id="battle-shout">"¡SALE! ¡SALE, COBARDE!"</div>
      
      <div style="font-size:0.85rem; margin-bottom: 5px;">
        Salut Enemiga: <span id="enemy-hp-text" style="color:#ff4757; font-weight:bold;">50 HP</span>
      </div>

      <!-- Barra de timing rítmic per encertar cops crítics -->
      <div class="timing-bar-container">
        <div class="timing-target-zone"></div>
        <div class="timing-cursor" id="timing-cursor"></div>
      </div>
      <p style="font-size:0.68rem; color:#aaa; margin-bottom:10px;">Ataca quan la línia blanca toqui la zona VERDA per un CRÍTIC!</p>

      <div class="combat-grid">
        <button class="combat-btn" onclick="Combat.strike()">💥 Clavar Cop Ganxet</button>
        <button class="combat-btn" onclick="Combat.dodge()">🛡️ Esquivar l'Envestida</button>
        <button class="combat-btn" onclick="Combat.drink()">🍸 Beure Vermut (+35 HP)</button>
        <button class="combat-btn" style="background:#57606f;" onclick="Combat.flee()">🏃 Fugir cap a Prim</button>
        <button class="combat-btn btn-power" id="btn-relig-power" onclick="Combat.useReligiousPower()">⚡ ACTIVA PODER DE FE</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE PREGUNTES DE REUS (SURVIVAL QUIZ) -->
  <div id="modal-quiz" class="modal-overlay" style="display:none;">
    <div class="game-window">
      <h2>💡 Control de Puresa Ganxeta</h2>
      <p id="quiz-question" style="font-size:0.9rem; margin:12px 0;">Pregunta...</p>
      <div class="quiz-answers" id="quiz-answers"></div>
    </div>
  </div>

  <script>
    /* ========================================================
       1. GENERADOR DE SO RETRO (Web Audio API)
       ======================================================== */
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playTone(freq, type, duration) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      hit() { this.playTone(130, 'sawtooth', 0.15); },
      crit() { 
        this.playTone(480, 'square', 0.1);
        setTimeout(() => this.playTone(720, 'square', 0.15), 100);
      },
      gulp() { this.playTone(320, 'sine', 0.25); },
      win() {
        [440, 554, 659, 880].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.18), i * 90);
        });
      },
      alarm() { this.playTone(220, 'sawtooth', 0.35); }
    };

    /* ========================================================
       2. AVATAR SVG PERSONALITZAT
       ======================================================== */
    const Avatar = {
      update() {
        const skin = document.getElementById('cfg-skin').value;
        const hat = document.getElementById('cfg-hat').value;
        const glasses = document.getElementById('cfg-glasses').value;

        let hatEl = '';
        if (hat === 'barretina') {
          hatEl = `<path d="M25,40 C20,10 65,12 78,20 C88,28 85,45 68,40 Z" fill="#b71515" stroke="#750c0c" stroke-width="2"/>
                   <rect x="24" y="36" width="52" height="8" fill="#111" rx="2"/>`;
        } else if (hat === 'gorra') {
          hatEl = `<ellipse cx="50" cy="36" rx="34" ry="12" fill="#594433"/>
                   <path d="M20,38 Q50,26 80,38" stroke="#2c1a0e" stroke-width="3" fill="none"/>`;
        } else if (hat === 'casc') {
          hatEl = `<path d="M22,38 C22,18 78,18 78,38 Z" fill="#00d2d3" stroke="#01a3a4" stroke-width="2"/>
                   <line x1="28" y1="36" x2="72" y2="36" stroke="#fff" stroke-width="3"/>`;
        } else if (hat === 'modernista') {
          hatEl = `<rect x="30" y="14" width="40" height="26" fill="#1e272c"/>
                   <ellipse cx="50" cy="40" rx="36" ry="6" fill="#1e272c"/>`;
        }

        let glassesEl = '';
        if (glasses === 'sol') {
          glassesEl = `<rect x="25" y="48" width="20" height="13" rx="3" fill="#111"/>
                       <rect x="55" y="48" width="20" height="13" rx="3" fill="#111"/>
                       <line x1="45" y1="54" x2="55" y2="54" stroke="#000" stroke-width="3"/>`;
        } else if (glasses === 'gaudi') {
          glassesEl = `<circle cx="36" cy="54" r="9" fill="none" stroke="#f39c12" stroke-width="2.5"/>
                       <circle cx="64" cy="54" r="9" fill="none" stroke="#f39c12" stroke-width="2.5"/>
                       <line x1="45" y1="54" x2="55" y2="54" stroke="#f39c12" stroke-width="2"/>`;
        } else if (glasses === 'pegat') {
          glassesEl = `<circle cx="36" cy="54" r="9" fill="#111"/>
                       <line x1="20" y1="42" x2="52" y2="66" stroke="#111" stroke-width="2"/>`;
        }

        const svg = `
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- Trencadís decoratiu de fons -->
            <polygon points="5,5 30,0 25,25 0,20" fill="#f39c12" opacity="0.3"/>
            <polygon points="75,0 100,5 95,25 70,20" fill="#8b0000" opacity="0.3"/>
            <!-- Cara -->
            <circle cx="50" cy="56" r="26" fill="${skin}" stroke="#22120b" stroke-width="2"/>
            <ellipse cx="37" cy="55" rx="3" ry="4" fill="#111"/>
            <ellipse cx="63" cy="55" rx="3" ry="4" fill="#111"/>
            <!-- Bigoti de taverna ganxeta -->
            <path d="M36,66 Q50,60 64,66 Q50,73 36,66 Z" fill="#382114"/>
            ${hatEl}
            ${glassesEl}
          </svg>
        `;

        document.getElementById('avatar-render').innerHTML = svg;
        document.getElementById('hud-avatar').innerHTML = svg;
      }
    };

    /* ========================================================
       3. DADES DEL CARRER AMPLE & FAUNA SURREALISTA
       ======================================================== */
    const Bestiary = [
      {
        name: "L'Home del 'SALE, COBARDE!'",
        shout: "¡SALE! ¡SALE, COBARDE! ¡TÚ NO TIENES COJONES!",
        hp: 50,
        maxHp: 50,
        atk: 14,
        speed: 1.2,
        icon: "🤬",
        dropNuts: 10
      },
      {
        name: "Transportista de l'Armari Trobat",
        shout: "Aguanta la cantonada que pesa 200 quilos i ratllarem el cotxe!",
        hp: 75,
        maxHp: 75,
        atk: 18,
        speed: 0.7,
        icon: "🚪",
        dropNuts: 20
      },
      {
        name: "Traficant de Patinet Trucat",
        shout: "Socio, vols un paquetet o t'atropello a 45 km/h per la vorera?!",
        hp: 40,
        maxHp: 40,
        atk: 16,
        speed: 1.6,
        icon: "🛴",
        dropNuts: 15
      },
      {
        name: "Comensal de Capipota a les 18:45h",
        shout: "Cambrer! On és el porro de pa i el cigaló de Chartreuse?!",
        hp: 60,
        maxHp: 60,
        atk: 11,
        speed: 0.9,
        icon: "🍲",
        dropNuts: 12
      }
    ];

    const ReusQuestions = [
      {
        q: "Estàs a la Fonda Suiza a les 7 de la tarda i el de la taula del costat crida al cambrer. Què està berenant legítimament?",
        opts: ["Un bowl de quinoa amb iogurt bio", "Capipota calenta amb vermut i olives farcides", "Croissant de matcha", "Xurros amb xocolata a 35 graus a l'ombra"],
        correct: 1
      },
      {
        q: "Cap a on apunta la cua del cavall del General Prim a la Plaça del Prim?",
        opts: ["Cap a la Fonda Suiza", "Cap a la ciutat veïna de Tarragona (per menyspreu secular)", "Cap a Salou", "Cap al campanar de la Prioral"],
        correct: 1
      },
      {
        q: "Si algú et bloqueja el Carrer Ample amb un armari de tres portes trobat al contenidor, com actues?",
        opts: ["Dius 'Bona peça, caoba pura!' i l'ajudes a pujar-lo a un 4t pis sense ascensor", "Truques a la Guàrdia Urbana", "Et poses a plorar", "Li demanes el tiquet de compra"],
        correct: 0
      }
    ];

    /* ========================================================
       4. MOTOR DEL JOC & MAPA (Epicentre: Fonda Suiza, Reus)
       ======================================================== */
    const Engine = {
      fondaCoords: [41.15935, 1.10772], // Carrer Ample, Reus
      playerCoords: [41.15935, 1.10772],
      player: {
        name: "Tonet",
        hp: 100,
        maxHp: 100,
        vermuts: 2,
        nuts: 20,
        religion: "Vermutisme"
      },
      map: null,
      playerMarker: null,
      activeEnemies: [],
      enemyMarkers: [],

      initGame() {
        Sound.init();
        const nm = document.getElementById('cfg-name').value.trim();
        if (nm) this.player.name = nm;
        this.player.religion = document.getElementById('cfg-religion').value;

        document.getElementById('hud-name').innerText = this.player.name;
        document.getElementById('hud-religion').innerText = this.player.religion;
        document.getElementById('btn-relig-power').innerText = `⚡ PODER: ${this.player.religion.toUpperCase()}`;

        document.getElementById('modal-char').style.display = 'none';
        Avatar.update();

        this.setupLeaflet();
        this.updateHUD();
        this.scanArea(); // Genera primers enemics
        Sound.win();
      },

      setupLeaflet() {
        this.map = L.map('map', { zoomControl: false }).setView(this.fondaCoords, 18);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(this.map);

        // Epicentre: Bar / Fonda Suiza
        const fondaIcon = L.divIcon({
          className: 'fonda-pin',
          html: `<div style="background:#8b0000; border:2px solid #f39c12; color:#fff; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 0 12px #f39c12;">🏨</div>`,
          iconSize: [34, 34]
        });
        L.marker(this.fondaCoords, { icon: fondaIcon }).addTo(this.map)
          .bindPopup("<b>FONDA SUIZA (Carrer Ample)</b><br>Quartell General Ganxet.");

        // Marcador Jugador
        const pIcon = L.divIcon({
          className: 'p-pin',
          html: `<div style="background:#f39c12; border:3px solid #fff; border-radius:50%; width:26px; height:26px; box-shadow:0 0 10px #000;"></div>`,
          iconSize: [26, 26]
        });
        this.playerMarker = L.marker(this.playerCoords, { icon: pIcon }).addTo(this.map);
      },

      scanArea() {
        Sound.alarm();
        // Neteja marcadors antics d'enemics
        this.enemyMarkers.forEach(m => this.map.removeLayer(m));
        this.enemyMarkers = [];
        this.activeEnemies = [];

        // Genera 4 personatges al voltant del carrer ample
        for (let i = 0; i < 4; i++) {
          const template = Bestiary[Math.floor(Math.random() * Bestiary.length)];
          const offsetLat = (Math.random() - 0.5) * 0.0016;
          const offsetLng = (Math.random() - 0.5) * 0.0016;
          const pos = [this.fondaCoords[0] + offsetLat, this.fondaCoords[1] + offsetLng];
          
          const enemy = {
            ...template,
            id: 'mob_' + Date.now() + '_' + i,
            pos: pos
          };
          this.activeEnemies.push(enemy);

          const icon = L.divIcon({
            className: 'enemy-pin',
            html: `<div style="background:#111; border:2px solid #ff4757; border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:16px; animation:bounce 1s infinite alternate;">${enemy.icon}</div>`,
            iconSize: [30, 30]
          });

          const marker = L.marker(pos, { icon: icon }).addTo(this.map);
          marker.on('click', () => Combat.start(enemy));
          this.enemyMarkers.push(marker);
        }
      },

      walkPlayer() {
        const dLat = (Math.random() - 0.5) * 0.0006;
        const dLng = (Math.random() - 0.5) * 0.0006;
        this.playerCoords = [this.playerCoords[0] + dLat, this.playerCoords[1] + dLng];
        this.playerMarker.setLatLng(this.playerCoords);
        this.map.panTo(this.playerCoords);
        Sound.gulp();

        // Si està molt a prop d'un enemic, combat immediat!
        const encounter = this.activeEnemies.find(e => {
          return Math.hypot(e.pos[0] - this.playerCoords[0], e.pos[1] - this.playerCoords[1]) < 0.00045;
        });

        if (encounter) {
          Combat.start(encounter);
        } else if (Math.random() > 0.65) {
          Quiz.open();
        }
      },

      gpsReal() {
        if (!navigator.geolocation) return alert("Sense GPS!");
        navigator.geolocation.getCurrentPosition(pos => {
          this.playerCoords = [pos.coords.latitude, pos.coords.longitude];
          this.playerMarker.setLatLng(this.playerCoords);
          this.map.setView(this.playerCoords, 18);
          alert("GPS sincronitzat! Si estàs al Carrer Ample de debò, vigila amb els patinets!");
        });
      },

      showFloatingText(text, color) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.color = color;
        el.style.left = (window.innerWidth / 2 - 40) + 'px';
        el.style.top = (window.innerHeight / 2 - 20) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
      },

      updateHUD() {
        document.getElementById('val-hp').innerText = this.player.hp;
        document.getElementById('val-vermut').innerText = this.player.vermuts;
        document.getElementById('val-nuts').innerText = this.player.nuts;
      }
    };

    /* ========================================================
       5. SISTEMA DE COMBAT RÍTMIC/ARCADE
       ======================================================== */
    const Combat = {
      enemy: null,
      cursorPos: 0,
      cursorDir: 1,
      timer: null,

      start(enemy) {
        this.enemy = { ...enemy };
        document.getElementById('battle-enemy-name').innerText = this.enemy.name;
        document.getElementById('battle-shout').innerText = `"${this.enemy.shout}"`;
        document.getElementById('enemy-hp-text').innerText = `${this.enemy.hp} HP`;
        document.getElementById('modal-combat').style.display = 'flex';
        
        Sound.alarm();
        this.runTimingBar();
      },

      runTimingBar() {
        const cursor = document.getElementById('timing-cursor');
        clearInterval(this.timer);
        this.cursorPos = 0;
        this.cursorDir = 3.5;

        this.timer = setInterval(() => {
          this.cursorPos += this.cursorDir;
          if (this.cursorPos >= 98 || this.cursorPos <= 0) {
            this.cursorDir *= -1;
          }
          cursor.style.left = this.cursorPos + '%';
        }, 16);
      },

      strike() {
        // Zona crítica entre 45% i 60%
        const isCrit = (this.cursorPos >= 44 && this.cursorPos <= 61);
        let dmg = isCrit ? 35 : 16;

        if (isCrit) {
          Sound.crit();
          Engine.showFloatingText("¡COP CRÍTIC GANXET! -35", "#2ed573");
        } else {
          Sound.hit();
          Engine.showFloatingText(`Cop de sifó -${dmg}`, "#fffa65");
        }

        this.enemy.hp -= dmg;
        document.getElementById('enemy-hp-text').innerText = `${Math.max(0, this.enemy.hp)} HP`;

        if (this.enemy.hp <= 0) {
          this.win();
          return;
        }

        // Resposta enemiga
        setTimeout(() => this.enemyTurn(), 450);
      },

      dodge() {
        Sound.gulp();
        if (Math.random() > 0.35) {
          Engine.showFloatingText("¡ESQUIVAT AMB ESTIL!", "#48dbfb");
        } else {
          Engine.player.hp -= 10;
          Sound.hit();
          Engine.showFloatingText("-10 HP (Empenta de l'armari)", "#ff4757");
          Engine.updateHUD();
        }
      },

      drink() {
        if (Engine.player.vermuts > 0) {
          Engine.player.vermuts--;
          Engine.player.hp = Math.min(Engine.player.maxHp, Engine.player.hp + 35);
          Sound.gulp();
          Engine.showFloatingText("+35 HP VERMUT FRESQUET", "#ffa502");
          Engine.updateHUD();
        } else {
          alert("Got buit! Necessites guanyar més vermuts!");
        }
      },

      useReligiousPower() {
        const rel = Engine.player.religion;
        Sound.crit();

        if (rel === 'Misericòrdia') {
          Engine.player.hp = Engine.player.maxHp;
          Engine.showFloatingText("¡MIRACLE DE MISERICÒRDIA! HP PLÈ", "#f39c12");
        } else if (rel === 'Vermutisme') {
          this.enemy.hp -= 45;
          Engine.showFloatingText("¡FLAMARADA DE VERMUT! -45 HP", "#e056fd");
        } else if (rel === 'Anti-Tarragona') {
          this.enemy.hp -= 40;
          Engine.showFloatingText("METRALLADORA D'AVELLANES! -40 HP", "#2ed573");
        } else {
          Engine.player.vermuts += 3;
          Engine.showFloatingText("+3 VERMUTS A DESHORES", "#fffa65");
        }

        document.getElementById('enemy-hp-text').innerText = `${Math.max(0, this.enemy.hp)} HP`;
        if (this.enemy.hp <= 0) this.win();
      },

      enemyTurn() {
        const dmg = Math.floor(Math.random() * this.enemy.atk) + 6;
        Engine.player.hp -= dmg;
        Sound.hit();
        Engine.showFloatingText(`-${dmg} HP ("${this.enemy.shout.slice(0, 10)}...")`, "#ff4757");
        Engine.updateHUD();

        if (Engine.player.hp <= 0) {
          clearInterval(this.timer);
          alert("Has caigut a la vorera del Carrer Ample... Et despertes prenent un cafè del temps.");
          Engine.player.hp = 60;
          Engine.updateHUD();
          document.getElementById('modal-combat').style.display = 'none';
        }
      },

      win() {
        clearInterval(this.timer);
        Sound.win();
        Engine.player.nuts += this.enemy.dropNuts;
        Engine.player.vermuts += 1;
        Engine.updateHUD();
        alert(`¡VICTÒRIA AL CARRER AMPLE!\nHas calmat ${this.enemy.name}.\nRecompensa: +${this.enemy.dropNuts} Avellanes i +1 Vermut.`);
        document.getElementById('modal-combat').style.display = 'none';
        Engine.scanArea(); // Regenera el carrer
      },

      flee() {
        clearInterval(this.timer);
        document.getElementById('modal-combat').style.display = 'none';
        Engine.showFloatingText("Has fugit cap a la Fonda!", "#fff");
      }
    };

    /* ========================================================
       6. PREGUNTES DE REUS
       ======================================================== */
    const Quiz = {
      open() {
        const q = ReusQuestions[Math.floor(Math.random() * ReusQuestions.length)];
        document.getElementById('quiz-question').innerText = q.q;
        const box = document.getElementById('quiz-answers');
        box.innerHTML = '';

        q.opts.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-btn';
          btn.innerText = opt;
          btn.onclick = () => {
            if (idx === q.correct) {
              Sound.win();
              Engine.player.vermuts += 2;
              Engine.player.hp = Math.min(100, Engine.player.hp + 20);
              Engine.updateHUD();
              alert("RESPOSTA 100% GANXETA! Guanyes 2 Vermuts i recuperes salut.");
            } else {
              Sound.hit();
              alert("Error garrafal! Sembles de la comarca del costat. Perds 10 HP.");
              Engine.player.hp = Math.max(10, Engine.player.hp - 10);
              Engine.updateHUD();
            }
            document.getElementById('modal-quiz').style.display = 'none';
          };
          box.appendChild(btn);
        });

        document.getElementById('modal-quiz').style.display = 'flex';
      }
    };

    // Inicialització en carregar
    window.onload = () => {
      Avatar.update();
    };
  </script>
</body>
</html>
